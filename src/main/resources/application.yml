spring:
  application:
    name: kafka-guard
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/kafkaguard}
    username: ${DB_USERNAME:kafkaguard}
    password: ${DB_PASSWORD:kafkaguard}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true

server:
  port: ${PORT:8090}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
